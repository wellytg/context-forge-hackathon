# Fleet Target Roster
# ===========================================================================
# Maps each simulated device ID to its role and on-disk manifest path.
# Used by batch_dispatcher.py to discover targets for fleet updates.
# ===========================================================================

version: "1.0"
description: "Development fleet target roster (7 devices)"

batch:
  # 1 Field Technician (High Privilege)
  - device_id: device-001-field
    role: field_tech
    current_manifest: manifests/example_field_tech.yaml

  # 2 Monitors (Mid Privilege: telemetry + diagnostics)
  - device_id: device-099-monitor
    role: monitor
    current_manifest: manifests/example_monitor.yaml

  - device_id: device-098-monitor
    role: monitor
    current_manifest: manifests/example_monitor_02.yaml

  # 4 Read-Only Agents (Low Privilege: telemetry only)
  - device_id: device-042-readonly
    role: read_only
    current_manifest: manifests/example_read_only.yaml

  - device_id: device-043-readonly
    role: read_only
    current_manifest: manifests/example_read_only_02.yaml

  - device_id: device-044-readonly
    role: read_only
    current_manifest: manifests/example_read_only_03.yaml

  - device_id: device-045-readonly
    role: read_only
    current_manifest: manifests/example_read_only_04.yaml
