[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "security-agent"
version = "0.1.0"
description = "Mission-critical fleet security agent with role-bounded capability deployment"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "typer>=0.12.3",
]

[project.scripts]
security-agent = "agent.main:cli_entry"
deploy-gate = "deploy_gate.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "manifests*", "roles*", "deploy_gate*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
